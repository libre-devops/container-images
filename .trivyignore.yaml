# Trivy exceptions to the scan gate (scripts/scan.sh). Every entry says why it
# is set aside and has an expiry date, after which it fails the gate again.
# Keep this list short, prefer waiting for an upstream fix to adding to it,
# and remove an entry as soon as its fix arrives. The README's "Vulnerability
# handling policy" lists the entries in force.
#
# vulnerabilities:
#   - id: CVE-0000-00000
#     paths: ["usr/local/bin/example"]
#     statement: Not reachable; the vulnerable function is never called.
#     expired_at: 2027-01-31
vulnerabilities:
  # The Azure Pipelines agent and the GitHub Actions runner each ship their own
  # .NET runtime and libraries, which only Microsoft and GitHub can update.
  # These findings apply. They were accepted by the maintainer on 2026-11-13,
  # for 30 days, so the agent images could ship while a release with patched
  # .NET is awaited; Renovate brings that release in. Paths are limited to the
  # agents' own manifests.
  - id: CVE-2026-84008
    paths: ["opt/azure-pipelines-agent/bin/*.deps.json"]
    statement: Azure Pipelines agent 5.282.0 bundles System.Security.Cryptography.Pkcs 9.0.10; fixed in 9.0.21, awaiting an agent release. Accepted risk, time-boxed.
    expired_at: 2026-12-13
  - id: CVE-2026-114149
    paths: ["opt/actions-runner/bin/*.deps.json"]
    statement: GitHub Actions runner 2.338.2 bundles Microsoft.AspNetCore.WebUtilities 8.0.25; fixed in 8.0.34, awaiting a runner release. Accepted risk, time-boxed.
    expired_at: 2026-12-13
  # GitLab Runner is one Go binary built by GitLab, with these modules
  # compiled in. GitLab's main branch already has both fixes, for the 19.6
  # release. Same terms as the agents above, applied on 2026-11-15.
  - id: CVE-2026-116587
    paths: ["usr/local/bin/gitlab-runner"]
    statement: GitLab Runner 19.5.3 is built with github.com/go-jose/go-jose/v4 4.1.4; fixed in 4.1.6, awaiting a runner release. Accepted risk, time-boxed.
    expired_at: 2026-12-13
  - id: CVE-2026-78661
    paths: ["usr/local/bin/gitlab-runner"]
    statement: GitLab Runner 19.5.3 is built with golang.org/x/net 0.58.0; fixed in 0.62.0, awaiting a runner release. Accepted risk, time-boxed.
    expired_at: 2026-12-13
  - id: CVE-2026-78669
    paths: ["usr/local/bin/gitlab-runner"]
    statement: GitLab Runner 19.5.3 is built with golang.org/x/net 0.58.0; fixed in 0.60.0, awaiting a runner release. Accepted risk, time-boxed.
    expired_at: 2026-12-13

# Kubernetes examples for Podman in a container (examples/kubernetes): not
# part of any image, and these settings are what running Podman in a pod
# needs, explained in each file and the README. Not time-boxed.
misconfigurations:
  - id: KSV-0017
    paths: ["examples/kubernetes/*.yaml"]
    statement: Privileged gives Podman /dev/fuse and its user namespace; the user-namespaces example avoids it.
  - id: KSV-0001
    paths: ["examples/kubernetes/*.yaml"]
    statement: newuidmap and newgidmap gain their capabilities on exec, which privilege escalation must allow.
  - id: KSV-0104
    paths: ["examples/kubernetes/*.yaml"]
    statement: The default seccomp profile blocks the user namespaces and mounts Podman makes.
  - id: KSV-0027
    paths: ["examples/kubernetes/*.yaml"]
    statement: Podman mounts /proc for its nested containers, which a masked /proc prevents.
  - id: KSV-0014
    paths: ["examples/kubernetes/*.yaml"]
    statement: Podman and the CI agents write to the container's filesystem.
  - id: KSV-0125
    paths: ["examples/kubernetes/*.yaml"]
    statement: Examples use the public ghcr.io images; a cluster's own registry allow-list decides this.
