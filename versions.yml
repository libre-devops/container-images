# Libre DevOps container images: the single source of truth.
#
# The builds, smoke tests, tags and README tables all come from this file,
# through scripts/images.py. Adding a version of an image is one line under
# that image's `versions` (plus a line under `bases` if it needs a new base).
#
# How the pins stay current:
#   - Tool versions here are bumped by Renovate (the lines marked
#     `renovate:`).
#   - The SHA-256 of every download, per platform, lives in
#     versions.lock.json, written by `just lock`. The Pins workflow rewrites
#     it on any pull request branch in this repository that changes a
#     version, so nobody recomputes a hash by hand.
#   - Base image digests below are written by `just pin`. The Pins workflow
#     refreshes them every Sunday and opens a pull request.

registries:
  - ghcr.io/libre-devops
  - docker.io/libredevops

# Existing packages (and package prefixes) in the registries that no image
# here may ever reuse the name of. Checked by `just validate`.
protected:
  - azdo-agent-containers
  - azdo-agent-rhel
  - azure-function-app-deployment-gh-action-base
  - azure-packer-gh-action-base
  - azure-pulumi-gh-action-base
  - azure-terraform-gh-action-base
  - cicd-base-images
  - powershell-helpers
  - python-helpers
  - terraform-apply-azure
  - terraform-azure-azdo-pipeline-templates
  - terraform-azure-composite-gh-action
  - terraform-azure-docker-gh-action
  - terraform-destroy-azure
  - terraform-plan-azure
  - terraform-plan-destroy-azure
  - ubuntu-base-docker-container

# Platform, and the GitHub-hosted runner that builds it natively.
platforms:
  linux/amd64: ubuntu-26.04
  linux/arm64: ubuntu-26.04-arm

# Base images, by key. Every Containerfile receives one as the BASE_IMAGE
# build argument and needs only a POSIX shell and one of apt-get, dnf,
# microdnf or apk, on glibc or musl, so moving to another distribution is a
# change to this block alone. Keep each value a bare reference: `just pin`
# rewrites it.
bases:
  alpine: dhi.io/alpine-base:3.24-alpine3.24-dev@sha256:266554e75cb00f88effe4048ba78b6f628d6a5ca67ac9e9727ae37a4a1299ce5
  debian: dhi.io/debian-base:trixie-debian13-dev@sha256:9e9caa90d9ef807a54a5cef570d83263715cfcb6f3e7342bc0625c80e3b258b8
  python-3.12: dhi.io/python:3.12-debian13-dev@sha256:c7090b12d1050252ee964efa9190124c3053a8679bfd7fa33aff9d5123fb673c
  python-3.13: dhi.io/python:3.13-debian13-dev@sha256:dbe603d026e33548f420346eb3963d3dd385a06148c1913bb5af32218829d4e2
  python-3.14: dhi.io/python:3.14-debian13-dev@sha256:60dbebd00c5332a2d5984a96f33b76d6e42167095a9db8c49cd0038ac388de77
  python-3.15: dhi.io/python:3.15-debian13-dev@sha256:98add6f52fc7dca59a55fc0618b6d40266922b0b8482f017c082a3dbe4ab89ab

# Other bases that every pull request builds and smoke tests the latest
# version of each image on, so that changing distribution stays a one-line
# edit. Nothing built on these is published.
portability:
  alpine: dhi.io/alpine-base:3.24-alpine3.24-dev@sha256:266554e75cb00f88effe4048ba78b6f628d6a5ca67ac9e9727ae37a4a1299ce5
  rhel: registry.access.redhat.com/ubi10/ubi:10.1@sha256:15f0a6e2b448ac7aa24425c9ab541e6402dc32b782844a285ccaeffb1c938fe1
  rhel-minimal: registry.access.redhat.com/ubi10/ubi-minimal:10.2@sha256:f0c7b9ae9914fcf183e7c36fc46864903c2d2caf3af327421913ae54b3d29e94
  wolfi: cgr.dev/chainguard/wolfi-base:latest@sha256:1f6b749929164c3d9e7cad0289254f39b2ba51e1dddaeb0fa57532ea03f2db31

# Tools, by exact version. The Go tools (shfmt, tenv, TFLint, terraform-docs,
# Conftest) are built from source with this Go, never downloaded as binaries,
# so they carry neither an old toolchain's vulnerabilities nor, thanks to
# `just lock`, their dependencies' known ones.
tools:
  # renovate: datasource=golang-version depName=go
  go: 1.27.4
  # renovate: datasource=github-releases depName=koalaman/shellcheck extractVersion=^v(?<version>.+)$
  shellcheck: 0.11.0
  # renovate: datasource=github-releases depName=mvdan/sh extractVersion=^v(?<version>.+)$
  shfmt: 3.14.1
  # renovate: datasource=github-releases depName=jqlang/jq extractVersion=^jq-(?<version>.+)$
  jq: 1.8.2
  # renovate: datasource=github-releases depName=astral-sh/uv
  uv: 0.13.7
  # renovate: datasource=github-releases depName=tofuutils/tenv extractVersion=^v(?<version>.+)$
  tenv: 4.15.1
  # renovate: datasource=github-releases depName=terraform-linters/tflint extractVersion=^v(?<version>.+)$
  tflint: 0.66.0
  # renovate: datasource=github-releases depName=terraform-docs/terraform-docs extractVersion=^v(?<version>.+)$
  terraform-docs: 0.24.0
  # renovate: datasource=github-releases depName=open-policy-agent/conftest extractVersion=^v(?<version>.+)$
  conftest: 0.71.1
  # Built from source (images/common/build-openssh.sh), at the latest release,
  # because Debian's openssh-client lags upstream security fixes: CVE-2026-60002
  # (critical; fixed in OpenSSH 10.4) was unfixed in Debian 13 when this was
  # added on 2026-11-13. Go back to the distribution's package (os_packages:
  # ssh) once it carries every fix the scan gate needs. See "Built from source"
  # in the README.
  # renovate: datasource=custom.openssh-portable depName=openssh
  openssh: 10.6p2
  # renovate: datasource=github-releases depName=libre-devops/ldo-cli extractVersion=^v(?<version>.+)$
  ldo-cli: 0.8.1
  # renovate: datasource=nuget depName=Az registryUrl=https://www.powershellgallery.com/api/v2/
  az-powershell: 16.5.0
  # renovate: datasource=nuget depName=Microsoft.Graph registryUrl=https://www.powershellgallery.com/api/v2/
  microsoft-graph: 2.41.2
  # renovate: datasource=nuget depName=Pester registryUrl=https://www.powershellgallery.com/api/v2/
  pester: 6.2.0
  # renovate: datasource=nuget depName=PSScriptAnalyzer registryUrl=https://www.powershellgallery.com/api/v2/
  psscriptanalyzer: 1.25.0
  # renovate: datasource=nuget depName=LibreDevOpsHelpers registryUrl=https://www.powershellgallery.com/api/v2/
  libredevopshelpers: 3.0.1
  # CI only; never installed in an image.
  # renovate: datasource=github-releases depName=aquasecurity/trivy extractVersion=^v(?<version>.+)$
  trivy: 0.76.2
  # renovate: datasource=github-releases depName=hadolint/hadolint extractVersion=^v(?<version>.+)$
  hadolint: 2.15.1
  # renovate: datasource=github-releases depName=sigstore/cosign extractVersion=^v(?<version>.+)$
  cosign: 3.1.4
  # renovate: datasource=github-releases depName=zizmorcore/zizmor extractVersion=^v(?<version>.+)$
  zizmor: 1.32.0
  # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.+)$
  actionlint: 1.7.12

# Terraform providers that azure-terraform carries in a local mirror, so that
# terraform init needs no registry: the newest patch of each of the newest
# three minor releases (as many as listed), each at least three days old.
# `just pin` re-resolves them, daily through the Pins workflow, so nobody edits
# these lists; `just lock` pins every zip once its release's signed checksums
# verify against the key scripts/images.py holds for its namespace.
terraform_providers:
  hashicorp/azurerm: ["5.13.0", "5.12.0", "5.11.0"]
  azure/azapi: ["2.13.0", "2.12.0", "2.11.0"]
  microsoft/msgraph: ["0.6.0", "0.5.0", "0.4.0"]

# In every image, on top of bash, git, curl and ca-certificates.
common: [shellcheck, shfmt, jq]

# Installed on CI runners by scripts/ci-tools.sh, as pinned release binaries.
ci: [uv, shellcheck, shfmt, hadolint, trivy, cosign, zizmor, actionlint]

# Each version entry takes:
#   version   The image's main tool version. Quote it ("3.12", never 3.12).
#   base      A key from `bases`.
#   python    The CPython it runs on, where that is not the version itself.
#   latest    true on exactly one entry per image: it gets the `latest` tag.
#   moving    Extra moving tags derived from the version: minor (1.17),
#             major (1).
#   aliases   Extra moving tags, literally.
#   flavour   A variant on another base, such as alpine: every tag gets the
#             suffix (1.17.1-alpine, 1-alpine), the latest entry of the
#             flavour is tagged with the flavour's name (alpine), and the
#             entry is addressed as <version>-<flavour> (just build terraform
#             1.17.1-alpine).
#   atop      Another image whose stage this entry is built on (its stage
#             starts FROM ${ATOP}), at that image's latest version, with
#             everything in it: the agents' toolbox flavours.
#   contents  This entry's README description, where it differs from the
#             image's.
#   base_stage
#             The stage every image stage in this entry's build starts from,
#             instead of base: podman for the -podman flavours, which then have
#             Podman, set up to run rootless inside a container, under them.
# Each image takes `description`, `contents` (the README description of one
# entry: {version}, {python}, any tool name and any included image's name,
# with - as _, are filled in), and optionally `tools`, `os_packages` (logical
# names for images/common/os-packages.sh), `download` (the version is itself
# a pinned download), `includes` (other images it is assembled from, at their
# latest versions), `tests` (the smoke test suites, default: its name, plus
# those of everything it includes) and `portability` (the portability bases
# it can run on, default: all).
# Every image is an `AS <name>` stage in images/Containerfile.
images:
  python:
    description: CPython and uv
    contents: CPython {version}, uv {uv}
    tools: [uv]
    versions:
      - { version: "3.12", base: python-3.12 }
      - { version: "3.13", base: python-3.13 }
      - { version: "3.14", base: python-3.14 }
      - { version: "3.15", base: python-3.15, latest: true, moving: [major] }

  podman:
    description: Podman that runs rootless inside a container (Podman in Podman, or in Docker or Kubernetes), with a docker command; the base of every -podman flavour
    contents: Podman {version} from the distribution, with crun, fuse-overlayfs and a docker command, rootless for the app user
    os_packages: [podman, crun, fuse-overlayfs, uidmap, libcap, "passt?", "docker-shim?"]
    # Neither Red Hat's UBI nor Docker Hardened Images' Alpine repositories
    # carry Podman.
    portability: [wolfi]
    versions:
      - { version: "5", base: debian, latest: true }

  azure-cli:
    description: The Azure CLI in its own virtual environment, and ldo-cli
    contents: Azure CLI {version} on Python {python}, ldo-cli {ldo_cli}
    tools: [uv, ldo-cli]
    versions:
      # renovate: datasource=pypi depName=azure-cli
      - { version: "2.92.0", python: "3.12", base: python-3.12, latest: true }
      # renovate: datasource=pypi depName=azure-cli
      - { version: "2.92.0", python: "3.12", base: python-3.12, flavour: podman, base_stage: podman, latest: true }
      # Long-lived line for networks whose TLS inspection fails the stricter
      # certificate checks in Python 3.13 and later. Not bumped by Renovate.
      - { version: "2.72.0", python: "3.12", base: python-3.12 }

  terraform:
    description: tenv with a default Terraform, TFLint, terraform-docs and Conftest
    contents: Terraform {version} by default (tenv {tenv}; a repository's .terraform-version wins), TFLint {tflint}, terraform-docs {terraform_docs}, Conftest {conftest}
    tools: [tenv, tflint, terraform-docs, conftest]
    versions:
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
      - { version: "1.17.2", base: debian, latest: true, moving: [minor, major] }
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
      - { version: "1.17.2", base: alpine, flavour: alpine, latest: true, moving: [minor, major] }
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
      - { version: "1.17.2", base: debian, flavour: podman, base_stage: podman, latest: true, moving: [minor, major] }

  ansible:
    description: ansible-core and ansible-lint in their own virtual environment, with OpenSSH and uv
    contents: ansible-core {version} on Python {python}, with ansible-lint, jmespath, netaddr, pywinrm, OpenSSH {openssh} and uv {uv}
    tools: [uv, openssh]
    # What the OpenSSH client built from source links against.
    os_packages: [openssl, zlib]
    versions:
      # renovate: datasource=pypi depName=ansible-core
      - { version: "2.22.0", python: "3.14", base: python-3.14, latest: true, moving: [minor] }
      # Only for managing hosts whose sole Python is 3.6, such as RHEL 8 and its
      # platform-python, without upgrading their Python first: ansible-core 2.17
      # and later need Python 3.7 or newer on every managed host. Renovate keeps
      # this line on 2.16 patch releases. Use the current line for anything else.
      # renovate: datasource=pypi depName=ansible-core
      - { version: "2.16.20", python: "3.12", base: python-3.12, moving: [minor], contents: "ansible-core {version} on Python {python}, for hosts whose only Python is 3.6 (RHEL 8): the last line that supports them. With ansible-lint, jmespath, netaddr, pywinrm, OpenSSH {openssh} and uv {uv}" }

  ansible-azure:
    description: The ansible image with the azure.azcollection collection and its Python requirements
    contents: azure.azcollection {version} and its Python requirements, on ansible-core {ansible} and Python {python}, with ansible-lint, OpenSSH {openssh} and uv {uv}
    includes: [ansible]
    download: azure-azcollection
    tests: [ansible, ansible-azure]
    versions:
      # renovate: datasource=galaxy-collection depName=azure.azcollection
      - { version: "4.2.0", base: python-3.14, latest: true, moving: [major] }

  azure-terraform:
    description: The terraform image with the azurerm, azapi and msgraph providers in a local mirror, for terraform init without the registry
    contents: "Terraform {version} by default, TFLint {tflint}, terraform-docs {terraform_docs}, Conftest {conftest}; in a local provider mirror, azurerm {azurerm}, azapi {azapi} and msgraph {msgraph}"
    provider_mirror: true
    versions:
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
      - { version: "1.17.2", base: debian, atop: terraform, latest: true, moving: [minor, major] }

  powershell:
    description: PowerShell LTS with PSScriptAnalyzer, Pester, Az, Microsoft.Graph and LibreDevOpsHelpers
    contents: PowerShell {version}, Az {az_powershell}, Microsoft.Graph {microsoft_graph}, Pester {pester}, PSScriptAnalyzer {psscriptanalyzer}, LibreDevOpsHelpers {libredevopshelpers}
    tools: [az-powershell, microsoft-graph, pester, psscriptanalyzer, libredevopshelpers]
    # .NET, which PowerShell runs on, needs ICU, OpenSSL, zlib and libstdc++.
    os_packages: [icu, openssl, zlib, libstdc++]
    download: powershell
    versions:
      # renovate: datasource=github-releases depName=PowerShell/PowerShell extractVersion=^v(?<version>.+)$
      - { version: "7.6.10", base: debian, latest: true, moving: [minor, major], aliases: [lts] }

  toolbox:
    description: Every tool above in one image, for ease
    contents: Python {python} and uv {uv}, Azure CLI {azure_cli}, ldo-cli {ldo_cli}, Terraform {terraform} by default (tenv {tenv}), TFLint {tflint}, terraform-docs {terraform_docs}, Conftest {conftest}, PowerShell {powershell} with Az {az_powershell}, Microsoft.Graph {microsoft_graph}, Pester {pester}, PSScriptAnalyzer {psscriptanalyzer} and LibreDevOpsHelpers {libredevopshelpers}
    # Assembled from the latest version of each, on the Azure CLI's Python.
    includes: [azure-cli, terraform, powershell]
    tools: [uv]
    tests: [python, azure-cli, terraform, powershell]
    versions:
      - { version: "1", base: python-3.12, latest: true }
      - { version: "1", base: python-3.12, flavour: podman, base_stage: podman, latest: true }

  # Self-hosted CI agents. Each registers itself from environment variables
  # when the container starts (see the README), runs one job and exits unless
  # told otherwise. The toolbox flavour adds everything in the toolbox image.
  azure-pipelines-agent:
    description: A self-hosted Azure Pipelines agent that registers itself from environment variables
    contents: Azure Pipelines agent {version}, with git, curl, jq, ShellCheck and shfmt
    download: azure-pipelines-agent
    # tar and gzip: the agents unpack themselves, and jobs (actions/cache, checkout) need them.
    os_packages: [icu, openssl, zlib, libstdc++, krb5, tar, gzip]
    versions:
      # renovate: datasource=github-releases depName=microsoft/azure-pipelines-agent extractVersion=^v(?<version>.+)$
      - { version: "5.282.0", base: debian, latest: true, moving: [major] }
      # renovate: datasource=github-releases depName=microsoft/azure-pipelines-agent extractVersion=^v(?<version>.+)$
      - { version: "5.282.0", base: python-3.12, flavour: toolbox, atop: toolbox, latest: true, moving: [major], contents: "Azure Pipelines agent {version} with everything in toolbox {toolbox}: Azure CLI {azure_cli}, Terraform {terraform}, PowerShell {powershell} with Az and Microsoft.Graph, Python {python}" }
      # renovate: datasource=github-releases depName=microsoft/azure-pipelines-agent extractVersion=^v(?<version>.+)$
      - { version: "5.282.0", base: python-3.12, flavour: toolbox-podman, atop: toolbox, base_stage: podman, latest: true, moving: [major], contents: "Azure Pipelines agent {version} with everything in toolbox {toolbox} and Podman {podman}, which jobs can use to build and run images (rootless; see the README for the outer container's flags)" }

  github-runner:
    description: A self-hosted GitHub Actions runner that registers itself from environment variables
    contents: GitHub Actions runner {version}, with git, curl, jq, ShellCheck and shfmt
    download: github-runner
    # tar and gzip: the agents unpack themselves, and jobs (actions/cache, checkout) need them.
    os_packages: [icu, openssl, zlib, libstdc++, krb5, tar, gzip]
    # GitHub publishes no musl build of the runner, so not Alpine.
    portability: [rhel, rhel-minimal, wolfi]
    versions:
      # renovate: datasource=github-releases depName=actions/runner extractVersion=^v(?<version>.+)$
      - { version: "2.338.2", base: debian, latest: true, moving: [major] }
      # renovate: datasource=github-releases depName=actions/runner extractVersion=^v(?<version>.+)$
      - { version: "2.338.2", base: python-3.12, flavour: toolbox, atop: toolbox, latest: true, moving: [major], contents: "GitHub Actions runner {version} with everything in toolbox {toolbox}: Azure CLI {azure_cli}, Terraform {terraform}, PowerShell {powershell} with Az and Microsoft.Graph, Python {python}" }
      # renovate: datasource=github-releases depName=actions/runner extractVersion=^v(?<version>.+)$
      - { version: "2.338.2", base: python-3.12, flavour: toolbox-podman, atop: toolbox, base_stage: podman, latest: true, moving: [major], contents: "GitHub Actions runner {version} with everything in toolbox {toolbox} and Podman {podman}, which jobs can use to build and run images (rootless; see the README for the outer container's flags)" }
